<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>No connection</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f7fb;
        color: #172033;
        font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { padding: 24px; max-width: 22rem; }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 1.5rem; }
      a {
        display: inline-block;
        min-height: 44px;
        padding: 10px 24px;
        box-sizing: border-box;
        border-radius: 999px;
        background: #1d68cf;
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>No connection</h1>
      <p>Shifta needs the internet. Check your connection, then try again.</p>
      <a href="https://www.shifta.com.au">Try again</a>
    </main>
  </body>
</html>
