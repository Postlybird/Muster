name: Phase 1 acceptance

# The long end-to-end run (brief §11): 3 businesses and 10 workers sign up
# and are approved, 20 shifts are posted, filled and worked, then the week's
# payroll file and invoices are made. It runs when the run itself changes,
# and by hand from the Actions tab ("Run workflow").
on:
  workflow_dispatch:
  push:
    paths:
      - "e2e/acceptance/**"
      - "playwright.acceptance.config.ts"
      - ".github/workflows/acceptance.yml"

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acceptance:
    name: Phase 1 acceptance run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEMO_MODE: "true"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      CRON_SECRET: ci-only-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Start a throwaway local Supabase
        run: npx supabase start

      - name: Point the app at the local Supabase
        run: |
          npx supabase status -o json > /tmp/supabase.json
          echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r .API_URL /tmp/supabase.json)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(jq -r .PUBLISHABLE_KEY /tmp/supabase.json)" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$(jq -r .SECRET_KEY /tmp/supabase.json)" >> "$GITHUB_ENV"

      - name: Load demo data
        run: npm run seed

      - name: Build
        run: npm run build

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Acceptance run
        run: npm run test:acceptance

      - name: Keep the test report if anything failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report
          path: playwright-report
          retention-days: 7
