<!-- Confirming a new or changed email address on the live site. -->
<p>
  Your code to confirm this email address is
  <strong style="font-size: 20px; letter-spacing: 2px">{{ .Token }}</strong>. It
  expires in 15 minutes.
</p>
<p>
  Or
  <a
    href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=email_change"
    >confirm it with this link</a
  >.
</p>
<p>If you didn't ask for this, you can ignore this email.</p>
