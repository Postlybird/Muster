<!-- The sign-in code email on the live site (sign-in and first sign-up).
     The link goes to /auth/confirm, whose address always carries a query
     (src/server/email-codes.ts), so the token is added with "&". -->
<p>
  Your sign-in code is
  <strong style="font-size: 20px; letter-spacing: 2px">{{ .Token }}</strong>. It
  expires in 15 minutes.
</p>
<p>
  Or
  <a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=email"
    >sign in with this link</a
  >.
</p>
<p>If you didn't ask for this code, you can ignore this email.</p>
